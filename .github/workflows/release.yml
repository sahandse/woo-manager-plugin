name: Plugin Release
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
      - run: composer validate --strict
      - run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction
      - run: find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Package installable plugin
        run: |
          mkdir -p dist/woo-manager
          rsync -a --exclude='.git' --exclude='.github' --exclude='dist' --exclude='composer.lock' --exclude='composer.json' ./ dist/woo-manager/
          cd dist && zip -r woo-manager-1.2.1.zip woo-manager
      - uses: actions/upload-artifact@v4
        with:
          name: woo-manager-plugin-1.2.1
          path: dist/woo-manager-1.2.1.zip
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/woo-manager-1.2.1.zip
          generate_release_notes: true
